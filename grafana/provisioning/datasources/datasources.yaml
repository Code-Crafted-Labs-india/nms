apiVersion: 1

datasources:
  - name: TimescaleDB
    uid: P40AE60E18F02DE32
    type: postgres
    access: proxy
    url: timescaledb:5432 # Matches the container name in your docker-compose
    user: postgres
    database: nms_db
    secureJsonData:
      password: ${DB_PASS} # Grafana automatically fills this using your Compose env variable!
    jsonData:
      sslmode: "disable"
      timescaledb: true # Tells Grafana to unlock specialized hypertable optimizing features
