services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: nms-timescaledb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=yoursecurepassword
      - POSTGRES_DB=nms_db
    networks:
      - nms_net
    volumes:
      - nms_db_data:/var/lib/postgresql/data
      - ./migration.sql:/docker-entrypoint-initdb.d/001-nms-schema.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nms_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  telegraf:
    image: telegraf:latest
    container_name: nms-telegraf
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - nms_net
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
    restart: unless-stopped

  # =========================================================================
  # GO MIDDLEWARE SERVICE CONTAINER
  # =========================================================================
  nms-middleware:
    build: .
    container_name: nms-middleware
    ports:
      - "8080:8080" # Exposed so the Grafana web form can POST CRUD requests
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      - net.ipv4.ping_group_range=0 2147483647
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - nms_net
    stop_grace_period: 15s
    restart: unless-stopped

  mock-switch-01:
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: mock-switch-01
    hostname: mock-switch-01
    cap_add:
      - NET_ADMIN
    environment:
      - DEVICE_TYPE=switch
      - BASE_CPU_IDLE=87      # access switch, mostly idle
      - MEM_TOTAL_KB=4194304  # 4 GB
      - MEM_USED_PCT=22
      - PEER_IPS=192.168.10.30                          # uplink to core only
      - PING_INTERVAL=0.15
      - PING_SIZE=768
    networks:
      nms_net:
        ipv4_address: 192.168.10.10

  mock-switch-02:
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: mock-switch-02
    hostname: mock-switch-02
    cap_add:
      - NET_ADMIN
    environment:
      - DEVICE_TYPE=switch
      - BASE_CPU_IDLE=75      # busier access switch
      - MEM_TOTAL_KB=4194304  # 4 GB
      - MEM_USED_PCT=38
      - PEER_IPS=192.168.10.30                          # uplink to core
      - PING_INTERVAL=0.1
      - PING_SIZE=1024
    networks:
      nms_net:
        ipv4_address: 192.168.10.11

  mock-router-01:
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: mock-router-01
    hostname: mock-router-01
    cap_add:
      - NET_ADMIN
    environment:
      - DEVICE_TYPE=router
      - BASE_CPU_IDLE=63      # WAN router, moderate load
      - MEM_TOTAL_KB=8388608  # 8 GB
      - MEM_USED_PCT=48
      - PEER_IPS=192.168.10.10 192.168.10.11 192.168.10.30
      - PING_INTERVAL=0.05
      - PING_SIZE=1200
    networks:
      nms_net:
        ipv4_address: 192.168.10.19

  mock-router-02:
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: mock-router-02
    hostname: mock-router-02
    cap_add:
      - NET_ADMIN
    environment:
      - DEVICE_TYPE=router
      - BASE_CPU_IDLE=52      # second WAN router, heavier load
      - MEM_TOTAL_KB=8388608  # 8 GB
      - MEM_USED_PCT=62
      - PEER_IPS=192.168.10.10 192.168.10.11 192.168.10.30
      - PING_INTERVAL=0.04
      - PING_SIZE=1200
    networks:
      nms_net:
        ipv4_address: 192.168.10.20

  mock-core-01:
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: mock-core-01
    hostname: mock-core-01
    cap_add:
      - NET_ADMIN
    environment:
      - DEVICE_TYPE=core
      - BASE_CPU_IDLE=42      # core router, high sustained load
      - MEM_TOTAL_KB=16777216 # 16 GB
      - MEM_USED_PCT=58
      - PEER_IPS=192.168.10.10 192.168.10.11 192.168.10.19 192.168.10.20
      - PING_INTERVAL=0.02    # 50 pps ≈ 1.1 Mbps per peer
      - PING_SIZE=1400
    networks:
      nms_net:
        ipv4_address: 192.168.10.30

  # =========================================================================
  # MONITORING PRESENTATION
  # =========================================================================
  grafana:
    build:
      context: .
      dockerfile: grafana/Dockerfile
    image: nms-grafana:latest
    container_name: nms-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - DB_PASS=${DB_PASSWORD:-yoursecurepassword}
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=volkovlabs-form-panel
    # Hard-force installation through the CLI boot vector before launching Grafana
    entrypoint: >
      sh -c "grafana cli plugins install volkovlabs-form-panel && exec /run.sh"
    volumes:
      - grafana_storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - nms_net
    restart: unless-stopped

networks:
  nms_net:
    ipam:
      config:
        - subnet: 192.168.10.0/24

volumes:
  grafana_storage:
  nms_db_data:
    driver: local
