services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: nms-timescaledb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD to a unique random value}
      - POSTGRES_DB=nms_db
    networks:
      - data_net
    volumes:
      - nms_db_data:/var/lib/postgresql/data
      - ./migration.sql:/docker-entrypoint-initdb.d/001-nms-schema.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nms_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  telegraf:
    image: telegraf:latest
    container_name: nms-telegraf
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - nms_net
      - data_net
    environment:
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD to a unique random value}
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
    restart: unless-stopped

  # =========================================================================
  # GO MIDDLEWARE SERVICE CONTAINER
  # =========================================================================
  nms-middleware:
    build: .
    container_name: nms-middleware
    expose:
      - "8080"
    environment:
      - NMS_BOOTSTRAP_TOKEN=${NMS_BOOTSTRAP_TOKEN:?Set NMS_BOOTSTRAP_TOKEN to at least 32 random characters}
      - NMS_DB_DSN=postgres://postgres:${DB_PASSWORD:?Set DB_PASSWORD to a unique random value}@timescaledb:5432/nms_db?sslmode=disable
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    sysctls:
      - net.ipv4.ping_group_range=0 2147483647
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - nms_net
      - data_net
      - app_net
    stop_grace_period: 15s
    restart: unless-stopped

  nms-ui:
    build:
      context: ./ui
    container_name: nms-ui
    ports:
      - "${NMS_BIND_ADDRESS:-127.0.0.1}:3000:8080"
    depends_on:
      - nms-middleware
    networks:
      - app_net
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  mock-switch-01:
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: mock-switch-01
    hostname: mock-switch-01
    cap_add:
      - NET_ADMIN
    environment:
      - DEVICE_TYPE=switch
      - DEVICE_MODEL=NCS 540-24Z8Q2C-SYS
      - DEVICE_OBJECT_ID=1.3.6.1.4.1.9.1.2981
      - BASE_CPU_IDLE=87      # access switch, mostly idle
      - MEM_TOTAL_KB=4194304  # 4 GB
      - MEM_USED_PCT=22
      - PEER_IPS=192.168.10.30
      - PING_INTERVAL=0.15
      - PING_SIZE=768
    networks:
      nms_net:
        ipv4_address: 192.168.10.10

  mock-switch-02:
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: mock-switch-02
    hostname: mock-switch-02
    cap_add:
      - NET_ADMIN
    environment:
      - DEVICE_TYPE=switch
      - DEVICE_MODEL=NCS 540-24Z8Q2C-SYS
      - DEVICE_OBJECT_ID=1.3.6.1.4.1.9.1.2981
      - BASE_CPU_IDLE=75      # busier access switch
      - MEM_TOTAL_KB=4194304  # 4 GB
      - MEM_USED_PCT=38
      - PEER_IPS=192.168.10.30
      - PING_INTERVAL=0.1
      - PING_SIZE=1024
    networks:
      nms_net:
        ipv4_address: 192.168.10.11

  mock-router-01:
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: mock-router-01
    hostname: mock-router-01
    cap_add:
      - NET_ADMIN
    environment:
      - DEVICE_TYPE=router
      - DEVICE_MODEL=NCS 540X-16Z4G8Q2C-A
      - DEVICE_OBJECT_ID=1.3.6.1.4.1.9.1.2983
      - BASE_CPU_IDLE=63      # WAN router, moderate load
      - MEM_TOTAL_KB=8388608  # 8 GB
      - MEM_USED_PCT=48
      - PEER_IPS=192.168.10.10 192.168.10.11 192.168.10.30
      - PING_INTERVAL=0.05
      - PING_SIZE=1200
    networks:
      nms_net:
        ipv4_address: 192.168.10.19

  mock-router-02:
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: mock-router-02
    hostname: mock-router-02
    cap_add:
      - NET_ADMIN
    environment:
      - DEVICE_TYPE=router
      - DEVICE_MODEL=NCS 540X-16Z4G8Q2C-A
      - DEVICE_OBJECT_ID=1.3.6.1.4.1.9.1.2983
      - BASE_CPU_IDLE=52      # second WAN router, heavier load
      - MEM_TOTAL_KB=8388608  # 8 GB
      - MEM_USED_PCT=62
      - PEER_IPS=192.168.10.10 192.168.10.11 192.168.10.30
      - PING_INTERVAL=0.04
      - PING_SIZE=1200
    networks:
      nms_net:
        ipv4_address: 192.168.10.20

  mock-core-01:
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: mock-core-01
    hostname: mock-core-01
    cap_add:
      - NET_ADMIN
    environment:
      - DEVICE_TYPE=core
      - DEVICE_MODEL=NCS 540X-16Z4G8Q2C-A
      - DEVICE_OBJECT_ID=1.3.6.1.4.1.9.1.2983
      - BASE_CPU_IDLE=42      # core router, high sustained load
      - MEM_TOTAL_KB=16777216 # 16 GB
      - MEM_USED_PCT=58
      - PEER_IPS=192.168.10.10 192.168.10.11 192.168.10.19 192.168.10.20
      - PING_INTERVAL=0.02
      - PING_SIZE=1400
    networks:
      nms_net:
        ipv4_address: 192.168.10.30

  # ── second core / distribution tier ─────────────────────────────────────────
  mock-core-02:
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: mock-core-02
    hostname: mock-core-02
    cap_add:
      - NET_ADMIN
    environment:
      - DEVICE_TYPE=core
      - DEVICE_MODEL=NCS 540X-16Z4G8Q2C-A
      - DEVICE_OBJECT_ID=1.3.6.1.4.1.9.1.2983
      - BASE_CPU_IDLE=55
      - MEM_TOTAL_KB=16777216
      - MEM_USED_PCT=44
      - PEER_IPS=192.168.10.30 192.168.10.12 192.168.10.13 192.168.10.21
      - PING_INTERVAL=0.03
      - PING_SIZE=1400
    networks:
      nms_net:
        ipv4_address: 192.168.10.31

  # ── distribution switch (aggregation layer) ───────────────────────────────────
  mock-dist-sw-01:
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: mock-dist-sw-01
    hostname: mock-dist-sw-01
    cap_add:
      - NET_ADMIN
    environment:
      - DEVICE_TYPE=switch
      - DEVICE_MODEL=NCS 540-24Z8Q2C-SYS
      - DEVICE_OBJECT_ID=1.3.6.1.4.1.9.1.2981
      - BASE_CPU_IDLE=68
      - MEM_TOTAL_KB=8388608
      - MEM_USED_PCT=31
      - PEER_IPS=192.168.10.30 192.168.10.31 192.168.10.12 192.168.10.13
      - PING_INTERVAL=0.08
      - PING_SIZE=900
    networks:
      nms_net:
        ipv4_address: 192.168.10.40

  # ── access switch tier (three more access switches) ───────────────────────────
  mock-switch-03:
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: mock-switch-03
    hostname: mock-switch-03
    cap_add:
      - NET_ADMIN
    environment:
      - DEVICE_TYPE=switch
      - DEVICE_MODEL=NCS 540-24Z8Q2C-SYS
      - DEVICE_OBJECT_ID=1.3.6.1.4.1.9.1.2981
      - BASE_CPU_IDLE=82
      - MEM_TOTAL_KB=4194304
      - MEM_USED_PCT=19
      - PEER_IPS=192.168.10.40
      - PING_INTERVAL=0.2
      - PING_SIZE=512
    networks:
      nms_net:
        ipv4_address: 192.168.10.12

  mock-switch-04:
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: mock-switch-04
    hostname: mock-switch-04
    cap_add:
      - NET_ADMIN
    environment:
      - DEVICE_TYPE=switch
      - DEVICE_MODEL=NCS 540-24Z8Q2C-SYS
      - DEVICE_OBJECT_ID=1.3.6.1.4.1.9.1.2981
      - BASE_CPU_IDLE=79
      - MEM_TOTAL_KB=4194304
      - MEM_USED_PCT=27
      - PEER_IPS=192.168.10.40
      - PING_INTERVAL=0.18
      - PING_SIZE=512
    networks:
      nms_net:
        ipv4_address: 192.168.10.13

  # ── STRESSED switch — deliberately high CPU and memory to trigger alarm rules ─
  mock-switch-stressed:
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: mock-switch-stressed
    hostname: mock-switch-stressed
    cap_add:
      - NET_ADMIN
    environment:
      - DEVICE_TYPE=switch
      - DEVICE_MODEL=NCS 540-24Z8Q2C-SYS
      - DEVICE_OBJECT_ID=1.3.6.1.4.1.9.1.2981
      - BASE_CPU_IDLE=8
      - MEM_TOTAL_KB=4194304
      - MEM_USED_PCT=92
      - PEER_IPS=192.168.10.30 192.168.10.31
      - PING_INTERVAL=0.12
      - PING_SIZE=768
    networks:
      nms_net:
        ipv4_address: 192.168.10.14

  # ── WAN edge router ───────────────────────────────────────────────────────────
  mock-wan-edge-01:
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: mock-wan-edge-01
    hostname: mock-wan-edge-01
    cap_add:
      - NET_ADMIN
    environment:
      - DEVICE_TYPE=router
      - DEVICE_MODEL=NCS 540X-16Z4G8Q2C-A
      - DEVICE_OBJECT_ID=1.3.6.1.4.1.9.1.2983
      - BASE_CPU_IDLE=45
      - MEM_TOTAL_KB=8388608
      - MEM_USED_PCT=55
      - PEER_IPS=192.168.10.19 192.168.10.20 192.168.10.30
      - PING_INTERVAL=0.06
      - PING_SIZE=1300
    networks:
      nms_net:
        ipv4_address: 192.168.10.21

  # ── firewalls ─────────────────────────────────────────────────────────────────
  mock-fw-01:
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: mock-fw-01
    hostname: mock-fw-01
    cap_add:
      - NET_ADMIN
    environment:
      - DEVICE_TYPE=router
      - DEVICE_MODEL=NCS 540X-16Z4G8Q2C-A
      - DEVICE_OBJECT_ID=1.3.6.1.4.1.9.1.2983
      - BASE_CPU_IDLE=60
      - MEM_TOTAL_KB=8388608
      - MEM_USED_PCT=42
      - PEER_IPS=192.168.10.21 192.168.10.30
      - PING_INTERVAL=0.1
      - PING_SIZE=800
    networks:
      nms_net:
        ipv4_address: 192.168.10.50

  mock-fw-02:
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: mock-fw-02
    hostname: mock-fw-02
    cap_add:
      - NET_ADMIN
    environment:
      - DEVICE_TYPE=router
      - DEVICE_MODEL=NCS 540X-16Z4G8Q2C-A
      - DEVICE_OBJECT_ID=1.3.6.1.4.1.9.1.2983
      - BASE_CPU_IDLE=65
      - MEM_TOTAL_KB=8388608
      - MEM_USED_PCT=38
      - PEER_IPS=192.168.10.50 192.168.10.30
      - PING_INTERVAL=0.1
      - PING_SIZE=800
    networks:
      nms_net:
        ipv4_address: 192.168.10.51

  # ── out-of-band management switch ────────────────────────────────────────────
  mock-oob-mgmt:
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: mock-oob-mgmt
    hostname: mock-oob-mgmt
    cap_add:
      - NET_ADMIN
    environment:
      - DEVICE_TYPE=switch
      - DEVICE_MODEL=NCS 540
      - DEVICE_OBJECT_ID=1.3.6.1.4.1.9.1.3009
      - BASE_CPU_IDLE=91
      - MEM_TOTAL_KB=2097152
      - MEM_USED_PCT=12
      - PEER_IPS=192.168.10.30
      - PING_INTERVAL=0.5
      - PING_SIZE=256
    networks:
      nms_net:
        ipv4_address: 192.168.10.60

  # =========================================================================
  # MONITORING PRESENTATION
  # =========================================================================
  grafana:
    build:
      context: .
      dockerfile: grafana/Dockerfile
    image: nms-grafana:latest
    container_name: nms-grafana
    ports:
      - "${NMS_BIND_ADDRESS:-127.0.0.1}:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD to a unique random value}
      - DB_PASS=${DB_PASSWORD:?Set DB_PASSWORD to a unique random value}
      # Disable Grafana's optional external reporting, update checks, and feeds.
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_NEWS_NEWS_FEED_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_DASHBOARDS_PUBLIC_DASHBOARDS_ENABLED=false
      - GF_PLUGINS_PLUGIN_ADMIN_ENABLED=false
      - GF_PLUGINS_PREINSTALL_DISABLED=true
    volumes:
      - grafana_storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - data_net
    restart: unless-stopped

networks:
  nms_net:
    ipam:
      config:
        - subnet: 192.168.10.0/24
  # Only the collector and middleware need to query the database. Keep the DB
  # on an internal network, away from direct host and device-facing egress.
  data_net:
    internal: true
  # Separate the host-published UI from the device-facing monitoring network.
  app_net:

volumes:
  grafana_storage:
  nms_db_data:
    driver: local
