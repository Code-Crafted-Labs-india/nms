services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: nms-timescaledb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=yoursecurepassword
      - POSTGRES_DB=nms_db
    ports:
      - "5432:5432"
    networks:
      - nms_net
    volumes:
      - nms_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nms_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  telegraf:
    image: telegraf:latest
    container_name: nms-telegraf
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - nms_net
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
    restart: unless-stopped

  # =========================================================================
  # GO MIDDLEWARE SERVICE CONTAINER
  # =========================================================================
  nms-middleware:
    build: .
    container_name: nms-middleware
    ports:
      - "8080:8080" # Exposed so the Grafana web form can POST CRUD requests
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      - net.ipv4.ping_group_range=0 2147483647
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - nms_net
    restart: unless-stopped

  mock-switch-01:
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: mock-switch-01
    networks:
      nms_net:
        ipv4_address: 192.168.10.10

  mock-switch-02:
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: mock-switch-02
    networks:
      nms_net:
        ipv4_address: 192.168.10.11

  mock-router-01:
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: mock-router-01
    networks:
      nms_net:
        ipv4_address: 192.168.10.19

  mock-router-02:
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: mock-router-02
    networks:
      nms_net:
        ipv4_address: 192.168.10.20

  mock-core-01:
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: mock-core-01
    networks:
      nms_net:
        ipv4_address: 192.168.10.30

  # =========================================================================
  # MONITORING PRESENTATION
  # =========================================================================
  grafana:
    image: grafana/grafana-oss:latest
    container_name: nms-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - DB_PASS=${DB_PASSWORD}
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=volkovlabs-form-panel
    # Hard-force installation through the CLI boot vector before launching Grafana
    entrypoint: >
      sh -c "grafana cli plugins install volkovlabs-form-panel && exec /run.sh"
    volumes:
      - grafana_storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - nms_net
    restart: unless-stopped

networks:
  nms_net:
    ipam:
      config:
        - subnet: 192.168.10.0/24

volumes:
  grafana_storage:
  nms_db_data:
    driver: local
