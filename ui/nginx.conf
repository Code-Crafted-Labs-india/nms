worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  sendfile on;
  keepalive_timeout 30;
  client_max_body_size 64k;
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
  map $http_x_forwarded_proto $origin_scheme {
    default $http_x_forwarded_proto;
    "" $scheme;
  }

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /healthz { access_log off; return 204; }

    location = /api/session {
      limit_req zone=login burst=3 nodelay;
      proxy_pass http://nms-middleware:8080;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $origin_scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_hide_header Server;
    }

    location /api/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://nms-middleware:8080;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $origin_scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_hide_header Server;
    }

    location /assets/ {
      expires 1y;
      try_files $uri =404;
    }

    location / {
      expires -1;
      try_files $uri $uri/ /index.html;
    }
  }
}
