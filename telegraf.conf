[agent]
  interval = "30s" # Network metrics collected every 30 seconds
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  hostname = "nms-core-ingestion"

# =========================================================================
# OUTPUT PLUGINS (Piping directly to TimescaleDB)
# =========================================================================
[[outputs.postgresql]]
  connection = "host=timescaledb user=postgres password=yoursecurepassword dbname=nms_db sslmode=disable"
  schema = "public"
  
  # Map measurements explicitly to separate tables for clean queries
  [[outputs.postgresql.mapping]]
    measurement = "ping"
    table = "device_reachability_raw"
  [[outputs.postgresql.mapping]]
    measurement = "snmp"
    table = "interface_state_raw"

# =========================================================================
# INPUT PLUGINS (Network Collection Engines)
# =========================================================================

# Track A: Concurrent ICMP Reachability Sweeps (Alarm 5)
[[inputs.ping]]
  ## List of network device IPs to monitor for reachability/latency
  urls = ["192.168.1.1", "192.168.1.5", "192.168.1.10"] 
  count = 3             # Number of ping packets sent per interval
  timeout = 1.0         # Time to wait for a response in seconds
  interval = "15s"      # High-frequency polling to catch flapping links early

# Track B: Core SNMP Engine for Availability (Alarms 1, 2, 4)
[[inputs.snmp]]
  ## Targets to poll via SNMP
  agents = ["udp://192.168.1.1:161", "udp://192.168.1.5:161", "udp://192.168.1.10:161"]
  version = 2
  community = "public"
  timeout = "3s"
  retries = 2

  ## Global Device Metadata (Saves the device name as a searchable tag)
  [[inputs.snmp.field]]
    name = "sysName"
    oid = "1.3.6.1.2.1.1.5.0" # RFC1213-MIB::sysName.0
    is_tag = true

  ## Interface Metrics Table 
  [[inputs.snmp.table]]
    name = "snmp"
    inherit_tags = ["sysName"]

    # Interface Index Identifier
    [[inputs.snmp.table.field]]
      name = "ifIndex"
      oid = "1.3.6.1.2.1.2.2.1.1" # IF-MIB::ifIndex
      is_tag = true

    # Interface Human-Readable Name (e.g., GigabitEthernet0/1)
    [[inputs.snmp.table.field]]
      name = "ifDescr"
      oid = "1.3.6.1.2.1.2.2.1.2" # IF-MIB::ifDescr
      is_tag = true

    # Link Statuses (1 = Up, 2 = Down, 3 = Testing)
    [[inputs.snmp.table.field]]
      name = "ifOperStatus"
      oid = "1.3.6.1.2.1.2.2.1.8" # IF-MIB::ifOperStatus

    [[inputs.snmp.table.field]]
      name = "ifAdminStatus"
      oid = "1.3.6.1.2.1.2.2.1.7" # IF-MIB::ifAdminStatus