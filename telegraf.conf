[agent]
  interval = "10s" # Rapid polling for quick visual validation
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  hostname = "nms-local-ingestion"

# Output direct to our TimescaleDB instance
[[outputs.postgresql]]
  connection = "host=timescaledb user=postgres password=yoursecurepassword dbname=nms_db sslmode=disable"
  schema = "public"
  
  # Automatically creates tables if they don't exist yet
  create_templates = [
    "CREATE TABLE {{.Table}} ({{.Columns}})",
    "SELECT create_hypertable({{.Table}}::regclass, 'time', if_not_exists => true);"
  ]

# Collects system CPU percentages
[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = false

# Collects system Memory consumption
[[inputs.mem]]