[agent]
  interval = "30s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  hostname = "nms-core-ingestion"

# =========================================================================
# OUTPUT PLUGINS
# =========================================================================
[[outputs.postgresql]]
  connection = "postgres://postgres:yoursecurepassword@timescaledb:5432/nms_db?sslmode=disable"
  schema = "public"
  tags_as_foreign_keys = false

# =========================================================================
# INPUT PLUGINS
# =========================================================================

# Track A: ICMP Reachability
[[inputs.ping]]
  urls = ["192.168.10.10", "192.168.10.11", "192.168.10.19", "192.168.10.20", "192.168.10.30"]
  count = 2
  timeout = 1.0
  interval = "15s"

# Track B: Device CPU and memory through standard UCD-SNMP OIDs
[[inputs.snmp]]
  agents = [
    "udp://192.168.10.10:161",
    "udp://192.168.10.11:161",
    "udp://192.168.10.19:161",
    "udp://192.168.10.20:161",
    "udp://192.168.10.30:161"
  ]
  version = 2
  community = "public"
  timeout = "3s"
  retries = 2
  name_override = "snmp_device_health"

  [[inputs.snmp.field]]
    name = "sysName"
    oid = "1.3.6.1.2.1.1.5.0"
    is_tag = true

  [[inputs.snmp.field]]
    name = "cpu_idle"
    oid = "1.3.6.1.4.1.99999.11.11.0"

  [[inputs.snmp.field]]
    name = "cpu_load_1"
    oid = "1.3.6.1.4.1.99999.10.1.3.1"
    conversion = "float"

  [[inputs.snmp.field]]
    name = "mem_total_kb"
    oid = "1.3.6.1.4.1.99999.4.5.0"

  [[inputs.snmp.field]]
    name = "mem_available_kb"
    oid = "1.3.6.1.4.1.99999.4.11.0"

# Track C: Production-style IF-MIB table polling (one row per interface)
[[inputs.snmp]]
  agents = [
    "udp://192.168.10.10:161",
    "udp://192.168.10.11:161",
    "udp://192.168.10.19:161",
    "udp://192.168.10.20:161",
    "udp://192.168.10.30:161"
  ]
  version = 2
  community = "public"
  timeout = "3s"
  retries = 2

  [[inputs.snmp.field]]
    name = "sysName"
    oid = "1.3.6.1.2.1.1.5.0"
    is_tag = true

  [[inputs.snmp.table]]
    name = "interface_performance_metrics"
    inherit_tags = ["sysName"]

    [[inputs.snmp.table.field]]
      name = "ifIndex"
      oid = "1.3.6.1.2.1.2.2.1.1"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "ifDescr"
      oid = "1.3.6.1.2.1.2.2.1.2"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "ifSpeed"
      oid = "1.3.6.1.2.1.2.2.1.5"

    [[inputs.snmp.table.field]]
      name = "ifAdminStatus"
      oid = "1.3.6.1.2.1.2.2.1.7"

    [[inputs.snmp.table.field]]
      name = "ifOperStatus"
      oid = "1.3.6.1.2.1.2.2.1.8"

    [[inputs.snmp.table.field]]
      name = "ifInOctets"
      oid = "1.3.6.1.2.1.2.2.1.10"

    [[inputs.snmp.table.field]]
      name = "ifInDiscards"
      oid = "1.3.6.1.2.1.2.2.1.13"

    [[inputs.snmp.table.field]]
      name = "ifInErrors"
      oid = "1.3.6.1.2.1.2.2.1.14"

    [[inputs.snmp.table.field]]
      name = "ifOutOctets"
      oid = "1.3.6.1.2.1.2.2.1.16"

    [[inputs.snmp.table.field]]
      name = "ifOutDiscards"
      oid = "1.3.6.1.2.1.2.2.1.19"

    [[inputs.snmp.table.field]]
      name = "ifOutErrors"
      oid = "1.3.6.1.2.1.2.2.1.20"
