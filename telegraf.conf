[agent]
  interval = "30s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  hostname = "nms-core-ingestion"

# SNMP, LLDP, and Telegraf ICMP inputs are generated from monitored inventory
# into the mounted telegraf-generated/inventory-targets.conf file.
[[outputs.postgresql]]
  connection = "postgres://postgres:${DB_PASSWORD}@timescaledb:5432/nms_db?sslmode=disable"
  schema = "public"
  tags_as_foreign_keys = false
