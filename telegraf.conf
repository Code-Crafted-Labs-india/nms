[agent]
  interval = "30s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  hostname = "nms-core-ingestion"

# =========================================================================
# OUTPUT PLUGINS
# =========================================================================
[[outputs.postgresql]]
  connection = "postgres://postgres:yoursecurepassword@timescaledb:5432/nms_db?sslmode=disable"
  schema = "public"
  tags_as_foreign_keys = false

# =========================================================================
# INPUT PLUGINS
# =========================================================================

# Track A: ICMP Reachability
[[inputs.ping]]
  urls = ["192.168.10.10", "192.168.10.20"] 
  count = 2
  timeout = 1.0
  interval = "15s"

# Track B: Unified SNMP Engine (MIB-Independent)
[[inputs.snmp]]
  agents = ["udp://192.168.10.10:161", "udp://192.168.10.20:161"]
  version = 2
  community = "public"
  timeout = "3s"
  retries = 2
  
  # Override to ensure table mapping matches your database
  name_override = "interface_performance_metrics"

  # Device Global Fields
  [[inputs.snmp.field]]
    name = "sysName"
    oid = "1.3.6.1.2.1.1.5.0"
    is_tag = true

  # Interface Operational Status (Direct OID lookup)
  [[inputs.snmp.field]]
    name = "ifOperStatus"
    oid = "1.3.6.1.2.1.2.2.1.8.1"

  # Interface Administrative Status (Direct OID lookup)
  [[inputs.snmp.field]]
    name = "ifAdminStatus"
    oid = "1.3.6.1.2.1.2.2.1.7.1"

  # Topology: LLDP Remote System Name (Direct OID lookup)
  [[inputs.snmp.field]]
    name = "target_device"
    oid = "1.0.8802.1.1.2.1.4.1.1.9.1"

  # Topology: LLDP Remote Port ID
  [[inputs.snmp.field]]
    name = "target_port"
    oid = "1.0.8802.1.1.2.1.4.1.1.7.1"