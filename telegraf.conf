[agent]
  interval = "30s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  hostname = "nms-core-ingestion"

# =========================================================================
# OUTPUT PLUGINS (Piping directly to TimescaleDB)
# =========================================================================
[[outputs.postgresql]]
  connection = "postgres://postgres:yoursecurepassword@timescaledb:5432/nms_db?sslmode=disable"
  schema = "public"
  tags_as_foreign_keys = false

# =========================================================================
# INPUT PLUGINS (Network Collection Engines)
# =========================================================================

# Track A: Concurrent ICMP Reachability Sweeps (Alarm 5) [cite: 7]
[[inputs.ping]]
  urls = ["192.168.10.10", "192.168.10.20"] 
  count = 2
  timeout = 1.0
  interval = "15s"

# Track B: Single Unified SNMP Engine for Availability & System Health [cite: 2]
[[inputs.snmp]]
  agents = ["udp://192.168.10.10:161", "udp://192.168.10.20:161"]
  version = 2
  community = "public"
  timeout = "3s"
  retries = 2

  # --- Device Global Fields ---
  [[inputs.snmp.field]]
    name = "sysName"
    oid = "1.3.6.1.2.1.1.5.0"
    is_tag = true

  # Fetch System Idle CPU (Alarm 3 placeholder / metrics profiling) [cite: 5]
  [[inputs.snmp.field]]
    name = "cpu_utilization"
    oid = "1.3.6.1.4.1.2021.11.11.0"

  # Fetch Free Memory space (Alarm 3) [cite: 5]
  [[inputs.snmp.field]]
    name = "memory_utilization"
    oid = "1.3.6.1.4.1.2021.4.11.0"

  # NTP Synchronization tracking placeholder (Alarm 9 - Optional) [cite: 11]
  [[inputs.snmp.field]]
    name = "ntp_skew_seconds"
    oid = "1.3.6.1.4.1.2021.100.1.1.0"

  # --- Device Tabular Interface Metrics (Alarm 2 & 4) --- [cite: 4, 6]
  [[inputs.snmp.table]]
    name = "snmp_interface"
    inherit_tags = ["sysName"]

    [[inputs.snmp.field]]
      name = "ifIndex"
      oid = "1.3.6.1.2.1.2.2.1.1"
      is_tag = true

    [[inputs.snmp.field]]
      name = "ifDescr"
      oid = "1.3.6.1.2.1.2.2.1.2"
      is_tag = true

    [[inputs.snmp.field]]
      name = "ifOperStatus"
      oid = "1.3.6.1.2.1.2.2.1.8"

    [[inputs.snmp.field]]
      name = "ifAdminStatus"
      oid = "1.3.6.1.2.1.2.2.1.7"